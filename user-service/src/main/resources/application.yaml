
spring:
  application:
    name: USER-SERVICE
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: create
      show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
jwt:
  validity:
    accessToken: 3600000
    refreshToken: 2592000000
  secret: jwt-secret-code


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
server:
  port: 8082
